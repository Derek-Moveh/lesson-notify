<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Notify — Teacher Library Management</title>
    <style>
        /* --- CSS Variables for Dark Theme (Default) --- */
        :root, :root[data-theme="dark"] {
            --bg-main: #050810;
            --bg-panel: #0b0f19;
            --card-bg: #111624;
            --card-hover: #161c2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-alt: #e2e8f0;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.04);
            --accent-purple: #8b5cf6;
            --accent-purple-hover: #9333ea;
            --accent-purple-bg: rgba(139, 92, 246, 0.12);
            --accent-purple-glow: rgba(139, 92, 246, 0.25);
            --shadow-color: rgba(0, 0, 0, 0.4);
            
            /* Tag / Badge Colors */
            --badge-pdf-bg: rgba(239, 68, 68, 0.15);
            --badge-pdf-text: #f87171;
            --badge-zip-bg: rgba(245, 158, 11, 0.15);
            --badge-zip-text: #fbbf24;
            --badge-video-bg: rgba(59, 130, 246, 0.15);
            --badge-video-text: #60a5fa;
            --badge-doc-bg: rgba(16, 185, 129, 0.15);
            --badge-doc-text: #34d399;
        }

        /* --- CSS Variables for Light Theme --- */
        :root[data-theme="light"], body.light-mode {
            --bg-main: #f8fafc;
            --bg-panel: #ffffff;
            --card-bg: #ffffff;
            --card-hover: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-alt: #334155;
            --border-color: #e2e8f0;
            --border-subtle: #f1f5f9;
            --accent-purple: #7c3aed;
            --accent-purple-hover: #6d28d9;
            --accent-purple-bg: rgba(124, 58, 237, 0.08);
            --accent-purple-glow: rgba(124, 58, 237, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.06);
            
            /* Tag / Badge Colors */
            --badge-pdf-bg: #fee2e2;
            --badge-pdf-text: #dc2626;
            --badge-zip-bg: #fef3c7;
            --badge-zip-text: #d97706;
            --badge-video-bg: #dbeafe;
            --badge-video-text: #2563eb;
            --badge-doc-bg: #d1fae5;
            --badge-doc-text: #059669;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; transition: background 0.3s ease, color 0.3s ease; }

        /* --- Sidebar --- */
        .sidebar {
            width: 70px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            padding-top: 20px;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 200;
            overflow-x: hidden;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }

        .sidebar:hover {
            width: 260px;
            box-shadow: 8px 0 30px var(--sidebar-shadow);
        }
        
        .sidebar-brand {
            display: flex; align-items: center; padding: 0 22px; margin-bottom: 30px;
            color: var(--text-main); font-size: 18px; font-weight: 800;
            white-space: nowrap; cursor: pointer;
        }
        .sidebar-brand svg { min-width: 24px; margin-right: 16px; color: var(--accent-green); }
        
        .sidebar-brand-text {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .sidebar:hover .sidebar-brand-text {
            opacity: 1;
            transition-delay: 0.05s;
        }

        .sidebar-menu { 
            list-style: none; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            padding: 0 12px; 
            height: 100%;
        }
        
        .sidebar-item {
            display: flex; align-items: center; padding: 12px 14px;
            color: var(--text-muted); text-decoration: none;
            border-radius: 8px; font-size: 14.5px; font-weight: 500;
            position: relative; white-space: nowrap;
            transition: background 0.25s, color 0.25s, transform 0.25s;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: var(--accent-green-bg);
            color: var(--text-main);
            box-shadow: 0 4px 12px var(--accent-green-glow);
        }

        .sidebar-item.active { 
            background: var(--accent-green-bg); 
            color: var(--accent-green); 
            font-weight: 600;
        }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            background: var(--accent-green);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .sidebar-icon { 
            min-width: 20px;
            height: 20px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: transform 0.2s ease; 
        }

        .sidebar-item:hover .sidebar-icon {
            transform: scale(1.15);
            color: var(--accent-green);
        }

        .sidebar-label {
            opacity: 0;
            margin-left: 16px;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-label {
            opacity: 1;
            transition-delay: 0.05s;
        }

        /* --- Main Content Area --- */
        .main-content { flex: 1; margin-left: 70px; display: flex; flex-direction: column; transition: margin-left 0.3s ease; }
        header { background: var(--bg-panel); border-bottom: 1px solid var(--border-color); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .badge-admin { background: rgba(16, 185, 129, 0.15); color: #10b981; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.3); }
        .header-right { display: flex; align-items: center; gap: 20px; }
        
        .btn-primary { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--accent-purple-hover); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-purple-glow); }
        
        .dashboard-container { max-width: 1200px; width: 100%; margin: 30px auto; padding: 0 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
        .page-title h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        .page-title p { color: var(--text-muted); font-size: 14.5px; }

        /* --- Resource Grid --- */
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .resource-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.25s ease; }
        .resource-card:hover { transform: translateY(-4px); border-color: rgba(139, 92, 246, 0.3); box-shadow: 0 8px 24px var(--shadow-color); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .file-icon-box { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--bg-main); border: 1px solid var(--border-color); }
        .badge-type { padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; }
        .type-pdf { background: var(--badge-pdf-bg); color: var(--badge-pdf-text); }
        .type-zip { background: var(--badge-zip-bg); color: var(--badge-zip-text); }
        .type-video { background: var(--badge-video-bg); color: var(--badge-video-text); }
        .type-doc { background: var(--badge-doc-bg); color: var(--badge-doc-text); }
        .card-body h3 { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; line-height: 1.3; }
        .card-body p { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid var(--border-subtle); }
        .file-meta { font-size: 12.5px; color: var(--text-muted); }
        
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { background: #ef4444; color: #fff; }

        /* --- Modal Styles --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.open { display: flex; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; position: relative; box-shadow: 0 10px 40px var(--shadow-color); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .modal-title { font-size: 20px; margin-bottom: 20px; color: var(--text-main); }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 6px; font-size: 13.5px; color: var(--text-alt); font-weight: 500; }
        .form-input, .form-select { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; outline: none; }
        .form-input:focus, .form-select:focus { border-color: var(--accent-purple); }
        .modal-actions { margin-top: 25px; }
        .btn-submit { width: 100%; background: var(--accent-purple); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>

        </div>

        <ul class="sidebar-menu">

                <a class="sidebar-item" href="teacher.html">
                    <div class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    </div>
                    <span class="sidebar-label">My Dashboard</span>
                </a>
            </li>
            <li>
                <a class="sidebar-item" href="my_schedule.html">
                    <div class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>

            <li>
                <a class="sidebar-item" href="my_students.html">

                    </div>
                    <span class="sidebar-label">My Students</span>
                </a>
            </li>
            <li>
                <a class="sidebar-item" href="teacher_communication.html">
                    <div class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    <span class="sidebar-label">Send Notification</span>
                </a>
            </li>
            <li>
                <a class="sidebar-item active" href="teacher_library.html">
                    <div class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <span class="sidebar-label">Resources library</span>
                </a>
            </li>
            <li style="margin-top: auto; padding-bottom: 20px;">
                <a class="sidebar-item" href="teacher_settings.html">
                    <div class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </div>
                    <span class="sidebar-label">Profile Settings</span>
                </a>
            </li>
        </ul>
    </aside>
    <!-- Main Content -->
    <div class="main-content">
        <header>
            <div class="header-left">
                <span class="badge-admin">Teacher Portal</span>
            </div>
            <div class="header-right">
                <button class="btn-primary" id="btnOpenUpload">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Upload Resource
                </button>
            </div>
        </header>

        <div class="dashboard-container">
            <div class="top-bar">
                <div class="page-title">
                    <h1>Library Management</h1>
                    <p>Upload and manage resources. Files added here instantly appear in the student portal.</p>
                </div>
            </div>

            <!-- Library Grid -->
            <div class="resource-grid" id="adminResourceGrid">
                <!-- Managed Cards populated via JS -->
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <button type="button" class="modal-close" id="closeUploadModal">✕</button>
            <h3 class="modal-title">Upload New Resource</h3>
            <form id="uploadResourceForm">
                <div class="form-group">
                    <label class="form-label">Resource Title</label>
                    <input type="text" class="form-input" id="resTitle" placeholder="e.g., Chapter 1 Notes" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-input" id="resDesc" placeholder="Brief description..." required>
                </div>
                <div class="form-group">
                    <label class="form-label">File Format</label>
                    <select class="form-select" id="resType">
                        <option value="pdf">PDF Document</option>
                        <option value="video">Video Stream (.mp4)</option>
                        <option value="zip">ZIP Archive</option>
                        <option value="doc">Word / Text Doc</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Select File</label>
                    <input type="file" class="form-input" id="resFile" required style="padding: 8px;">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-submit">Upload to Library</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- Modal Control ---
        const uploadModal = document.getElementById('uploadModal');
        const btnOpenUpload = document.getElementById('btnOpenUpload');
        const closeUploadModal = document.getElementById('closeUploadModal');
        const uploadForm = document.getElementById('uploadResourceForm');
        
        btnOpenUpload.addEventListener('click', () => uploadModal.classList.add('open'));
        closeUploadModal.addEventListener('click', () => uploadModal.classList.remove('open'));

        // --- Library Logic ---
        const adminGrid = document.getElementById('adminResourceGrid');
        
        const iconMap = {
            'pdf': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`,
            'zip': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`,
            'video': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>`,
            'doc': `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`
        };
        const badgeTextMap = { 'pdf': 'PDF Guide', 'zip': 'ZIP Code', 'video': 'Video Stream', 'doc': 'Document' };

        function loadAdminLibrary() {
            const library = JSON.parse(localStorage.getItem('ln_library_resources')) || [];
            
            if (library.length === 0) {
                adminGrid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1;">Your library is empty. Upload resources to share them with your students.</p>`;
                return;
            }

            adminGrid.innerHTML = '';
            library.forEach((resource, index) => {
                const card = document.createElement('div');
                card.className = 'resource-card';
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <div class="file-icon-box">
                                ${iconMap[resource.type] || iconMap['doc']}
                            </div>
                            <span class="badge-type type-${resource.type}">${badgeTextMap[resource.type] || 'File'}</span>
                        </div>
                        <div class="card-body">
                            <h3>${resource.title}</h3>
                            <p>${resource.desc}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="file-meta"><span>${resource.size}</span>${resource.date}</div>
                        <button class="btn-delete" onclick="deleteResource(${index})">Remove File</button>
                    </div>
                `;
                adminGrid.appendChild(card);
            });
        }

        // --- Handle Upload Form Submission ---
        uploadForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('resTitle').value;
            const desc = document.getElementById('resDesc').value;
            const type = document.getElementById('resType').value;
            
            // Simulate file sizing
            const fakeSize = (Math.random() * 8 + 1).toFixed(1) + " MB";
            const uploadDate = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            const newResource = { title, desc, type, size: fakeSize, date: uploadDate };

            let library = JSON.parse(localStorage.getItem('ln_library_resources')) || [];
            library.unshift(newResource);
            localStorage.setItem('ln_library_resources', JSON.stringify(library));

            uploadForm.reset();
            uploadModal.classList.remove('open');
            loadAdminLibrary(); // Reload page to show new file
        });

        // --- Handle File Deletion ---
        window.deleteResource = function(index) {
            if(confirm('Are you sure you want to remove this file? Students will no longer see it.')) {
                let library = JSON.parse(localStorage.getItem('ln_library_resources')) || [];
                library.splice(index, 1);
                localStorage.setItem('ln_library_resources', JSON.stringify(library));
                loadAdminLibrary();
            }
        }

        // Initialize theme and load library on startup
        const savedTheme = localStorage.getItem('lesson_notify_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if(savedTheme === 'light') document.body.classList.add('light-mode');
        
        loadAdminLibrary();
    </script>
</body>
</html>
