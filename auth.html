<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Lesson Notify — Security Access Gate</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease; }
        body { 
            background: #06080f;
            color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            overflow-x: hidden; position: relative;
        }

        /* LIGHT MODE OVERRIDES */
        body.light-theme {
            background: #f8fafc;
            color: #0f172a;
        }
        body.light-theme .auth-card {
            background: rgba(255, 255, 255, 0.88);
            border-color: rgba(226, 232, 240, 0.9);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        }
        body.light-theme .auth-card:hover {
            border-color: rgba(16, 185, 129, 0.35);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.08), 0 0 30px rgba(16, 185, 129, 0.1);
        }
        body.light-theme .logo-wrapper {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.08);
        }
        body.light-theme h2 { color: #0f172a; }
        body.light-theme .subtitle { color: #475569; }
        body.light-theme label { color: #334155; }
        body.light-theme input, body.light-theme select {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #0f172a;
        }
        body.light-theme input:focus, body.light-theme select:focus {
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        /* Light Theme Hover Glows for Inputs */
        body.light-theme input:hover, body.light-theme select:hover {
            border-color: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }
        /* Light Theme Logo Text Adaptation */
        body.light-theme .logo-text-lesson {
            fill: #0f172a;
        }

        #liveWallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        .auth-card { 
            background: rgba(11, 15, 25, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); text-align: center; position: relative; z-index: 10;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .auth-card:hover {
            transform: translateY(-4px);
            border-color: rgba(16, 185, 129, 0.35);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7), 0 0 30px rgba(16, 185, 129, 0.15), 0 0 60px rgba(37, 99, 235, 0.1);
        }
        .logo-wrapper { 
            max-width: 160px; margin: 0 auto 25px auto; background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 6px; 
        }
        .logo-text-lesson {
            fill: #ffffff;
            transition: fill 0.3s ease;
        }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #64748b; font-size: 13.5px; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 12.5px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Input & Select Hover Glow Styling */
        input, select { 
            width: 100%; padding: 12px; background: #111827; border: 1px solid #1f2937; border-radius: 6px; color: #ffffff; font-size: 14.5px; transition: all 0.25s ease; 
        }
        input:hover, select:hover {
            border-color: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }
        input:focus, select:focus { 
            outline: none; border-color: #10b981; box-shadow: 0 0 14px rgba(16, 185, 129, 0.35); 
        }

        .btn-submit { 
            background: linear-gradient(-45deg, #10b981, #2563eb); background-size: 200% 200%;
            color: #ffffff; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.3s;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4); }
        .toggle-link { color: #10b981; text-decoration: none; font-size: 13.5px; font-weight: 600; display: inline-block; margin-top: 20px; cursor: pointer; transition: color 0.2s; }
        .toggle-link:hover { color: #34d399; }
        .error-banner { display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #ef4444; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; text-align: left; }

        /* --- SCHOOL SELECTION POPUP MODAL STYLING --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #0b0f19; border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 16px; width: 90%; max-width: 480px; padding: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 30px rgba(16, 185, 129, 0.15);
            display: flex; flex-direction: column; max-height: 80vh;
        }
        body.light-theme .modal-card {
            background: #ffffff; border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; font-weight: 700; color: #fff; }
        body.light-theme .modal-header h3 { color: #0f172a; }
        .close-modal { background: none; border: none; color: #94a3b8; font-size: 28px; cursor: pointer; line-height: 1; }
        .close-modal:hover { color: #ef4444; }
        .search-box-wrapper { margin-bottom: 15px; }
        .search-box-wrapper input { width: 100%; padding: 12px 14px; background: #111827; border: 1px solid #1f2937; border-radius: 6px; color: #fff; font-size: 14px; }
        body.light-theme .search-box-wrapper input { background: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
        .school-list-container { overflow-y: auto; max-height: 280px; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .school-item {
            padding: 12px 16px; background: #111827; border: 1px solid #1f2937; border-radius: 8px;
            color: #f8fafc; font-size: 14px; cursor: pointer; text-align: left; transition: all 0.2s ease;
        }
        .school-item:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        body.light-theme .school-item { background: #f8fafc; border-color: #e2e8f0; color: #0f172a; }
        body.light-theme .school-item:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.08); }
    </style>
</head>
<body>

    <!-- High-Tech Live Wallpaper Canvas -->
    <canvas id="liveWallpaper"></canvas>

    <div class="auth-card">
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 80" width="100%">
              <rect x="10" y="10" width="55" height="60" rx="10" fill="#1e40af" />
              <circle cx="53" cy="22" r="11" fill="#10b981" stroke="#06080f" stroke-width="2.5" />
              <text class="logo-text-lesson" x="85" y="52" font-family="sans-serif" font-size="38" font-weight="900" fill="#ffffff">Lesson</text>
              <text x="215" y="52" font-family="sans-serif" font-size="38" font-weight="900" fill="#10b981">Notify</text>
            </svg>
        </div>

        <h2 id="authTitle">Create Your Account</h2>
        <p class="subtitle" id="authSubtitle">Get started managing institutional timetable automated notifications.</p>

        <div class="error-banner" id="errorBanner"></div>

        <form id="authForm">
            <div class="form-group" id="nameGroup">
                <label>Full Name</label>
                <input type="text" id="authName" placeholder="e.g., Derek Moveh">
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="name@institution.com" required>
            </div>

            <div class="form-group" id="phoneGroup">
                <label>Active Phone Number (With Country Code)</label>
                <input type="text" id="authPhone" placeholder="e.g., 2348030000000">
            </div>
            
            <div class="form-group">
                <label>Security Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>

            <div class="form-group" id="roleGroup">
                <label>Your Institutional Role</label>
                <select id="signupRole" required>
                    <option value="teacher">Faculty Instructor / Lecturer</option>
                    <option value="student">Enrolled Student / Learner</option>
                </select>
            </div>
            
            <div class="form-group" id="schoolGroup">
                <label>Institution / School Name</label>
                <input type="text" id="schoolSelectBtn" placeholder="Select School" readonly required style="cursor: pointer;">
                <input type="hidden" id="signupSchoolValue" required>
                <p style="font-size: 11px; color: #64748b; margin-top: 4px;">Click to choose your registered institutional workspace.</p>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">Register Workspace</button>
        </form>

        <span class="toggle-link" id="authToggle">Already have an account? Sign In</span>
    </div>

    <!-- School Selection Modal Popup -->
    <div class="modal-overlay" id="schoolModalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Select Your Institution</h3>
                <button type="button" class="close-modal" id="closeSchoolModal">&times;</button>
            </div>
            <div class="search-box-wrapper">
                <input type="text" id="schoolSearchInput" placeholder="Search school by name...">
            </div>
            <div class="school-list-container" id="schoolListContainer">
                <div class="school-item" style="text-align: center; color: #94a3b8; cursor: default;">Loading schools...</div>
            </div>
        </div>
    </div>
    
    <script>
        // Sync theme with localStorage preference set from welcome.html
        if (localStorage.getItem('lesson_notify_theme') === 'light') {
            document.body.classList.add('light-theme');
        }

        // High-Tech Live Wallpaper Animation Logics
        const canvas = document.getElementById('liveWallpaper');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.7;
                this.vy = (Math.random() - 0.5) * 0.7;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }
            draw() {
                ctx.fillStyle = 'rgba(16, 185, 129, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) {
            particles.push(new Particle());
        }

        function animateWallpaper() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        ctx.strokeStyle = `rgba(37, 99, 235, ${0.18 * (1 - dist / 130)})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateWallpaper);
        }
        animateWallpaper();

        // Check URL parameters to determine initial mode
        const urlParams = new URLSearchParams(window.location.search);
        const modeParam = urlParams.get('mode');
        let isSignUpMode = modeParam !== 'signin';

        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const btnSubmit = document.getElementById('btnSubmit');
        const authToggle = document.getElementById('authToggle');
        const nameGroup = document.getElementById('nameGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const roleGroup = document.getElementById('roleGroup');
        const schoolGroup = document.getElementById('schoolGroup');
        const errorBanner = document.getElementById('errorBanner');

        const signupRole = document.getElementById('signupRole');
        const schoolSelectBtn = document.getElementById('schoolSelectBtn');
        const signupSchoolValue = document.getElementById('signupSchoolValue');
        const schoolModalOverlay = document.getElementById('schoolModalOverlay');
        const closeSchoolModal = document.getElementById('closeSchoolModal');
        const schoolSearchInput = document.getElementById('schoolSearchInput');
        const schoolListContainer = document.getElementById('schoolListContainer');

        let allSchools = [];

        // Open modal on click of school select button
        schoolSelectBtn.addEventListener('click', () => {
            schoolModalOverlay.classList.add('active');
            schoolSearchInput.value = '';
            schoolSearchInput.focus();
            renderSchoolList(allSchools);
        });

        // Close modal
        closeSchoolModal.addEventListener('click', () => {
            schoolModalOverlay.classList.remove('active');
        });

        schoolModalOverlay.addEventListener('click', (e) => {
            if (e.target === schoolModalOverlay) {
                schoolModalOverlay.classList.remove('active');
            }
        });

        // Search/Filter schools live as user types
        schoolSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allSchools.filter(school => school.toLowerCase().includes(query));
            renderSchoolList(filtered);
        });

        function renderSchoolList(schools) {
            schoolListContainer.innerHTML = '';
            if (schools.length === 0) {
                schoolListContainer.innerHTML = '<div class="school-item" style="text-align: center; color: #94a3b8; cursor: default;">No institutions found</div>';
                return;
            }

            schools.forEach(schoolName => {
                const item = document.createElement('div');
                item.className = 'school-item';
                item.textContent = schoolName;
                item.addEventListener('click', () => {
                    schoolSelectBtn.value = schoolName;
                    signupSchoolValue.value = schoolName;
                    schoolSelectBtn.style.color = '#ffffff';
                    if (document.body.classList.contains('light-theme')) {
                        schoolSelectBtn.style.color = '#0f172a';
                    }
                    schoolModalOverlay.classList.remove('active');
                });
                schoolListContainer.appendChild(item);
            });
        }

        // Fetch registered schools from database or local storage fallback
        async function fetchRegisteredSchools() {
            try {
                const response = await fetch('http://localhost:5000/api/schools');
                const data = await response.json();
                
                if (data.success && data.schools.length > 0) {
                    allSchools = data.schools.map(s => s.school_name);
                } else {
                    allSchools = [];
                }
            } catch (err) {
                console.warn('Backend unavailable. Falling back to local storage schools.');
                const users = getStoredUsers();
                allSchools = [...new Set(users.filter(u => u.school_name).map(u => u.school_name))];
            }
        }

        // Initialize schools list on load
        fetchRegisteredSchools();

        function renderAuthState() {
            errorBanner.style.display = 'none';
            
            if (isSignUpMode) {
                authTitle.textContent = "Create Your Account";
                authSubtitle.textContent = "Get started managing institutional timetable automated notifications.";
                btnSubmit.textContent = "Register Workspace";
                authToggle.textContent = "Already have an account? Sign In";
                nameGroup.style.display = "block";
                phoneGroup.style.display = "block";
                roleGroup.style.display = "block";
                schoolGroup.style.display = "block";
            } else {
                authTitle.textContent = "Welcome Back";
                authSubtitle.textContent = "Enter your security details to open your system workspace dashboard.";
                btnSubmit.textContent = "Secure Sign In";
                authToggle.textContent = "Don't have an account? Sign Up";
                nameGroup.style.display = "none";
                phoneGroup.style.display = "none";
                roleGroup.style.display = "none";
                schoolGroup.style.display = "none";
            }
        }

        renderAuthState();

        authToggle.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            renderAuthState();
        });

        function getStoredUsers() {
            try {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                return Array.isArray(users) ? users : [];
            } catch (err) {
                return [];
            }
        }

        function redirectByRole(role) {
            const currentUrl = new URL(window.location.href);
            const targetFile = role === 'teacher' ? 'teacher.html' : 'student.html';
            window.location.href = new URL(targetFile, currentUrl.href).href;
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBanner.style.display = 'none';
            btnSubmit.textContent = "Processing...";
            btnSubmit.disabled = true;

            const email = document.getElementById('authEmail').value.trim().toLowerCase();
            const password = document.getElementById('authPassword').value;
            
            try {
                if (isSignUpMode) {
                    const fullName = document.getElementById('authName').value.trim();
                    const role = signupRole.value;
                    const schoolName = signupSchoolValue.value;

                    if (!email || !password || !schoolName || !role) {
                        throw new Error('Please select an institution and fill in all required fields.');
                    }

                    const response = await fetch('http://localhost:5000/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullName, email, password, role, schoolName })
                    });

                    const data = await response.json();
                    
                    if (!response.ok) throw new Error(data.error || 'Registration failed');

                    localStorage.setItem('currentUser', JSON.stringify({
                        id: data.user.user_id,
                        name: data.user.full_name,
                        role: data.user.role,
                        school_name: data.user.school_name
                    }));

                    redirectByRole(data.user.role);

                } else {
                    const response = await fetch('http://localhost:5000/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (!response.ok) throw new Error(data.error || 'Login failed');

                    localStorage.setItem('currentUser', JSON.stringify({
                        id: data.user.userId,
                        name: data.user.fullName,
                        role: data.user.role,
                        school_name: data.user.schoolName
                    }));

                    redirectByRole(data.user.role);
                }
            } catch (err) {
                errorBanner.textContent = `⚠️ Security Alert: ${err.message}`;
                errorBanner.style.display = 'block';
                btnSubmit.textContent = isSignUpMode ? "Register Workspace" : "Secure Sign In";
                btnSubmit.disabled = false;
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('🚀 Lesson Notify PWA Core Active!', reg.scope))
                    .catch(err => console.warn('PWA registration failed:', err));
            });
        }
    </script>
</body>
</html>
